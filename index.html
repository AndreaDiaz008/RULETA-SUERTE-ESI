
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La ruleta de la suerte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="contenedor">
        <h1>LA RULETA DE LA SUERTE</h1>
        <p class="subtitulo">¿Te animás a probar tu suerte?</p>

        <div class="ruleta-contenedor">
            <div class="puntero"></div>
            <div class="ruleta" id="ruleta">
                <div class="centro"></div>
            </div>
        </div>

        <section id="resultado" class="resultado">
            <h2 id="tituloResultado">¿Y si probás?</h2>
            <p id="textoResultado">
                Girá la ruleta y descubrí qué pasa.
            </p>
        </section>

        <button id="botonGirar">GIRAR RULETA</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
